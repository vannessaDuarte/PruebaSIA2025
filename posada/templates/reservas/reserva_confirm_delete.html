{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <div class="alert alert-danger" role="alert">
        <h4 class="alert-heading">⚠️ Confirmar Eliminación</h4>
        <p>¿Está seguro de que desea eliminar la reserva #{{ reserva.pk }} a nombre de <strong>{{ reserva.cliente.nombre }}</strong> para la habitación <strong>{{ reserva.habitacion.numero }}</strong>?</p>
        <hr>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sí, Eliminar</button>
            <a href="{% url 'lista_reservas' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock content %}
