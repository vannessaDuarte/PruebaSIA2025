{% extends "base.html" %}

{% block title %}Crear Tipo de Habitación{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow-sm p-4">
        <h2>Crear Nuevo Tipo de Habitación</h2>
        <p class="text-muted">Define el nombre y el precio base (ej: Suite, Doble, etc.)</p>
        <hr>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }} 
            <button type="submit" class="btn btn-success">Guardar Tipo</button>
            <a href="{% url 'lista_habitaciones' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock content %}
