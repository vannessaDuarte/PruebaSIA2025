{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <h2>{% if form.instance.pk %}Editar Cliente{% else %}Agregar Nuevo Cliente{% endif %}</h2>
    <hr>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }} 
        <button type="submit" class="btn btn-success">Guardar Cliente</button>
        <a href="{% url 'lista_clientes' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock content %}
